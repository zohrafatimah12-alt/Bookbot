# Render Blueprint: New + > Blueprint > pick the Bookbot GitHub repository.
services:
  - type: web
    name: bookbot-api
    runtime: python
    plan: free
    # rootDir omitted = repository root
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # Comma-separated browser origins allowed to call the API (no trailing
      # slash). Add more after a comma, e.g. a custom domain. Not a secret.
      # http://localhost:8000 is always allowed by app.py for local work.
      - key: FRONTEND_ORIGINS
        value: https://bookbot-frontend-eight.vercel.app
